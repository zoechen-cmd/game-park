<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="遊戲樂園">
<meta name="theme-color" content="#ffcf3d">
<title>🎮 遊戲樂園</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    background:linear-gradient(160deg,#eaf4ff 0%,#f7ecff 50%,#fff3e6 100%);
    color:#334;
    overflow:hidden;
  }
  /* ===== 首頁選單 ===== */
  #menu{
    position:absolute; inset:0; overflow:auto;
    display:flex; flex-direction:column; align-items:center;
    padding:max(24px,env(safe-area-inset-top)) 20px 40px;
  }
  .hero{ text-align:center; margin:18px 0 6px; }
  .hero h1{
    font-size:clamp(30px,7vw,52px); margin:0; letter-spacing:2px;
    color:#3a4a6b; text-shadow:0 3px 0 #fff, 0 6px 14px rgba(120,140,200,.25);
  }
  .hero p{ font-size:clamp(14px,3.4vw,18px); color:#7a86a8; margin:8px 0 0; }
  .grid{
    width:100%; max-width:760px; margin-top:22px;
    display:grid; grid-template-columns:repeat(2,1fr); gap:18px;
  }
  @media (max-width:520px){ .grid{ grid-template-columns:1fr; } }
  .card{
    border:none; cursor:pointer; border-radius:26px; padding:26px 18px 22px;
    background:linear-gradient(150deg,var(--c1),var(--c2));
    box-shadow:0 10px 22px rgba(90,110,170,.22), inset 0 2px 0 rgba(255,255,255,.5);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    transition:transform .12s ease, box-shadow .12s ease;
    color:#2b3550;
  }
  .card:active{ transform:translateY(4px) scale(.98); box-shadow:0 5px 12px rgba(90,110,170,.22); }
  .card .emo{ font-size:clamp(50px,12vw,72px); line-height:1;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.15)); }
  .card .tt{ font-size:clamp(21px,5vw,27px); font-weight:800; letter-spacing:1px; }
  .card .sb{ font-size:clamp(13px,3.2vw,15px); opacity:.82; font-weight:600; }
  .foot{ margin-top:26px; font-size:13px; color:#9aa4c0; text-align:center; line-height:1.7; }

  /* ===== 遊戲全螢幕：頂部一條「換遊戲」細長欄 + 底下遊戲，互不重疊 ===== */
  #stage{ position:absolute; inset:0; display:none; flex-direction:column; background:#38344f; }
  #stage.on{ display:flex; }
  #topbar{ flex:0 0 auto; display:flex; align-items:center;
    padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px; background:#38344f; }
  #frame{ flex:1 1 auto; width:100%; border:none; background:#fff; min-height:0; }
  #back{
    border:none; cursor:pointer; border-radius:999px;
    padding:8px 16px 8px 12px; font-size:15px; font-weight:800;
    font-family:inherit; color:#3a4a6b;
    background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.35);
    display:flex; align-items:center; gap:5px;
  }
  #back:active{ transform:scale(.96); }
</style>
</head>
<body>

  <section id="menu">
    <div class="hero">
      <h1>🎮 遊戲樂園</h1>
      <p>選一個開始玩吧！</p>
    </div>
    <div class="grid">
      <button class="card" style="--c1:#ffd89b;--c2:#ff9a76" onclick="openGame('g0','📖 伊索寓言樂園')">
        <span class="emo">📖</span>
        <span class="tt">伊索寓言樂園</span>
        <span class="sb">聽故事 · 龜兔賽跑・狼來了</span>
      </button>
      <button class="card" style="--c1:#a1ffce;--c2:#5ec6b8" onclick="openGame('g1','➕ 快樂加法')">
        <span class="emo">➕</span>
        <span class="tt">快樂加法</span>
        <span class="sb">三種玩法一起練加法</span>
      </button>
      <button class="card" style="--c1:#89f7fe;--c2:#66a6ff" onclick="openGame('g2','🐍 小蛇吃水果')">
        <span class="emo">🐍</span>
        <span class="tt">小蛇吃水果</span>
        <span class="sb">50 關 · 可調正常/慢速</span>
      </button>
      <button class="card" style="--c1:#fbc2eb;--c2:#a18cd1" onclick="openGame('g3','🧱 疊疊小方塊')">
        <span class="emo">🧱</span>
        <span class="tt">疊疊小方塊</span>
        <span class="sb">50 關大冒險</span>
      </button>
      <button class="card" style="--c1:#ffcf8f;--c2:#f0955d" onclick="openGame('g4','🃏 卡皮巴拉翻翻樂')">
        <span class="emo">🃏</span>
        <span class="tt">卡皮巴拉翻翻樂</span>
        <span class="sb">30 關 · 記憶配對難度升</span>
      </button>
      <button class="card" style="--c1:#8be8fa;--c2:#5a9be6" onclick="openGame('g5','🍄 卡皮巴拉大冒險')">
        <span class="emo">🍄</span>
        <span class="tt">卡皮巴拉大冒險</span>
        <span class="sb">3 大關 · 吃蘑菇變大、丟火球</span>
      </button>
      <button class="card" style="--c1:#ffd27a;--c2:#ff7a59" onclick="openGame('g6','🏎️ 卡皮巴拉賽車')">
        <span class="emo">🏎️</span>
        <span class="tt">卡皮巴拉賽車</span>
        <span class="sb">3 條賽道 · 吃道具搶第一</span>
      </button>
      <button class="card" style="--c1:#b8f0a0;--c2:#5fbf5a" onclick="openGame('g7','🌷 卡皮巴拉花園')">
        <span class="emo">🌷</span>
        <span class="tt">卡皮巴拉花園</span>
        <span class="sb">10 種花 · 8 級花店 · 換造型</span>
      </button>
    </div>
    <div class="foot">不用網路、不用登入 — 直接玩<br>可傳到手機或平板離線玩</div>
  </section>

  <section id="stage">
    <div id="topbar"><button id="back" onclick="closeGame()">⬅️ 換遊戲</button></div>
    <iframe id="frame" title="遊戲" allow="autoplay; fullscreen"></iframe>
  </section>

  function b64ToHtml(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++){ bytes[i] = bin.charCodeAt(i); }
    return new TextDecoder("utf-8").decode(bytes);
  }

  function openGame(id, label){
    var html = b64ToHtml(GAMES[id]);
    var frame = document.getElementById("frame");
    frame.setAttribute("title", label);
    frame.srcdoc = html;              // 每次重載 = 遊戲重新開始
    document.getElementById("stage").classList.add("on");
    document.getElementById("menu").style.display = "none";
    // iOS 捲動鎖定
    document.body.style.position = "fixed";
    document.body.style.width = "100%";
  }

  function closeGame(){
    var frame = document.getElementById("frame");
    frame.srcdoc = "";                // 卸載遊戲、釋放記憶體
    document.getElementById("stage").classList.remove("on");
    document.getElementById("menu").style.display = "flex";
    document.body.style.position = "";
    document.body.style.width = "";
  }

  // 手機返回鍵 / 瀏覽器上一頁：先回選單而不是離開網頁
  window.addEventListener("keydown", function(e){
    if (e.key === "Escape" && document.getElementById("stage").classList.contains("on")) closeGame();
  });

  // PWA：註冊 service worker（「加到主畫面」後可離線開啟）；file:// 或不支援時自動略過
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
</script>
